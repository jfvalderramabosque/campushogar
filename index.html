  case 'racc':{const r=reqById(d.i);if(!r)break;r.status='aceptada';if(isSim(r.eid))sched(2500,'simaccept',{rid:r.id,who:'est'});else nt(r.eid,'Tu solicitud fue aceptada. Revisa y firma el contrato.',{scr:'req',rid:r.id},'req');save();render();toast('Solicitud aceptada');break}
  case 'rrej':{const r=reqById(d.i);if(!r)break;r.status='rechazada';r.reason='El arrendador no pudo aceptar tu solicitud en este momento.';if(!isSim(r.eid))nt(r.eid,'Tu solicitud no fue aceptada.',{scr:'req',rid:r.id},'req');save();render();toast('Solicitud rechazada');break}
  case 'rcod':{const r=reqById(d.i);if(!r)break;r.status='codeudor';if(isSim(r.eid))sched(3000,'simcod',{rid:r.id});else nt(r.eid,'El arrendador pide un codeudor o acudiente.',{scr:'req',rid:r.id},'req');save();render();toast('Codeudor solicitado');break}
  case 'codform':go('cod',{rid:d.i});break;
  case 'codsend':{const E={},n=String(S.f.cn||'').trim(),p=String(S.f.cp||'').trim();if(!/^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{5,60}$/.test(n))E.cn='Escribe nombre y apellido.';if(!/^3\d{9}$/.test(p))E.cp='Celular de 10 dígitos que inicia en 3.';S.err=E;if(Object.keys(E).length){render();break}
    const r=reqById(S.rid),l=getL(r.lid);r.cod={n,p:p.slice(0,3)+'•••'+p.slice(-2),rel:fv('cr','Madre/Padre')};r.status='enviada';if(isSeed(l.ll))sched(3000,'decide',{rid:r.id});else nt(l.ll,'El estudiante aportó un codeudor.',{scr:'req',rid:r.id},'req');save();back();toast('Codeudor enviado al arrendador');break}
  case 'sign':{const r=reqById(d.i);if(!r)break;if(est())r.ce=true;else r.ca=true;const ok=regIfBoth(r);save();render();toast(ok?'Acuerdo registrado':'Firmaste. Esperando a la otra parte.');break}
  case 'end':{const r=reqById(d.i);if(r)endReq(r);break}
  case 'copyc':{const r=reqById(d.i);if(r)copy(contractText(r,getL(r.lid)),'Contrato copiado');break}
  case 'rate':S.rstars=+d.n;render();break;
  case 'rtag':{const i=S.rtags.indexOf(d.t);i>=0?S.rtags.splice(i,1):S.rtags.push(d.t);render();break}
  case 'rsubmit':{const r=reqById(d.i);if(!r)break;if(!S.rstars){S.err={rt:'Elige de 1 a 5 estrellas.'};render();break}
    r.rt=r.rt||{};r.rt[S.role]={n:S.rstars,tags:S.rtags.slice(),txt:String(fv('rtxt','')).trim(),ts:Date.now()};
    const l=getL(r.lid),tgt=est()?l.ll:r.eid,tu=uById(tgt);if(tu&&!isSim(tgt)){tu.ver.res=true;nt(tgt,'Recibiste una nueva calificación.',{scr:'req',rid:r.id},'req')}
    if(est()===false&&!isSim(r.eid)&&uById(r.eid))uById(r.eid).ver.res=true;
    S.rstars=0;S.rtags=[];S.f={};S.err={};save();render();toast('Gracias por calificar');break}
  case 'notif':go('notif');break;
  case 'ncl':{const n=S.notifs.find(x=>x.id===d.i);if(n){n.read=true;save();openGo(n.go)}break}
  case 'nread':myNotifs().forEach(n=>n.read=true);save();render();break;
  case 'report':S.f.rep=true;render();break;
  case 'rsend2':delete S.f.rep;save();render();toast('Reporte enviado. Gracias por cuidar la comunidad.');break;
  case 'share':copy('CampusHogar · '+(getL(d.i)||{title:''}).title+'','Enlace copiado');break;
  case 'safety':go('safety');break;
  case 'ver':go('vfy',{vk:d.k,vcap:false,vstep:0,vm:'ocr',vcode:String(Math.floor(100000+Math.random()*900000))});break;
  case 'vmeth':S.vm=d.m;S.vcap=false;S.vstep=0;S.err={};render();break;
  case 'vcap':{S.vcap='run';S.vstep=0;S.err={};render();setTimeout(()=>{S.vstep=1;render()},700);setTimeout(()=>{S.vstep=2;S.vcap='done';render()},1400);break}
  case 'vok':doVfy();break;
  case 'psaveu':{const n=String(fv('pn',u.name)).trim();if(n.length<3){toast('Escribe un nombre válido');break}u.name=n;if(est()){u.uni=fv('pu',u.uni||'ueb');u.origin=String(fv('po',u.origin||'')).trim()}save();render();toast('Datos guardados');break}
  case 'ntog':u.np=u.np||{};u.np[d.k]=el.checked;save();break;
  case 'copydata':S.showData=true;render();copy(userData(u),'Tus datos fueron copiados');break;
  case 'deldata':S.delAsk='acct';render();break;
  case 'pdel0':S.delAsk=null;render();break;
  case 'deldata2':deleteAccount();break;
  case 'out':S.uid=null;S.role=null;S.scr='welcome';S.nav=[];S.f={};save();render();break;
  case 'pnew':S.pstep=1;go('pnew',{pstep:1});break;
  case 'pstepn':if(stepVal()){S.pstep++;render()}else render();break;
  case 'pstepb':S.pstep=Math.max(1,S.pstep-1);render();break;
  case 'pcreate':createProp();break;
  case 'pver':go('pver',{pid:d.i,gstep:null});break;
  case 'pman':go('pman',{pid:d.i});S.delAsk=null;break;
  case 'gmode':S.mode=d.m;save();render();break;
  case 'gsrc':S.src=d.m;save();render();break;
  case 'geo':doGeo(d.i);break;
  case 'psave':{const p=S.props.find(x=>x.id===d.i);if(!p)break;const pr=ntoNum(S.f.ep!==undefined?S.f.ep:p.price),ad=ntoNum(S.f.ea!==undefined?S.f.ea:p.adm);if(pr<300000||pr>8000000){S.err={ep:'Entre $300.000 y $8.000.000.'};render();break}p.price=pr;p.adm=ad;p.avail=S.f.ev||p.avail;S.err={};save();render();toast('Cambios guardados');break}
  case 'pnfc':{const p=S.props.find(x=>x.id===d.i);if(p){p.nfc=!p.nfc;save();render();toast(p.nfc?'Etiqueta NFC activada':'Etiqueta NFC desactivada')}break}
  case 'ppause':{const p=S.props.find(x=>x.id===d.i);if(p){p.status=p.status==='pausado'?'publicado':'pausado';save();render();toast(p.status==='pausado'?'Anuncio pausado':'Anuncio reanudado')}break}
  case 'pdel':S.delAsk=d.i;render();break;
  case 'pdel2':{S.reqs=S.reqs.filter(r=>r.lid!==d.i);S.threads=S.threads.filter(t=>t.lid!==d.i);S.visits=S.visits.filter(v=>v.lid!==d.i);S.props=S.props.filter(p=>p.id!==d.i);S.delAsk=null;const x=me();x.ver.geo=S.props.some(p=>p.owner===x.id&&p.geo&&p.geo.v==='ok')?true:undefined;S.nav=[];S.scr='main';S.tab=0;save();render();toast('Inmueble eliminado');break}
  }});
/* ===== Entradas ===== */
document.addEventListener('input',ev=>{const el=ev.target,id=el.id;if(!id)return;
  if(el.hasAttribute('data-f')){S.f[id]=el.type==='checkbox'?el.checked:el.value;if(id==='cm'){const l=getL(S.sel);if(l){$('cmv').textContent=el.value;$('cmt').textContent=money((l.price+(l.adm||0))*+el.value)}}}
  if(id==='sq'){S.F.q=el.value;S.loaded=true;save();softRender()}
  else if(id==='fpmin'||id==='fpmax'||id==='fdmax'||id==='fsmin'){const v=+el.value;if(id==='fpmin'){S.F.pmin=v;if(S.F.pmax<v){S.F.pmax=v;$('fpmax').value=v}}if(id==='fpmax'){S.F.pmax=v;if(S.F.pmin>v){S.F.pmin=v;$('fpmin').value=v}}if(id==='fdmax')S.F.dmax=v;if(id==='fsmin')S.F.smin=v;
    $('fpminv').textContent=money(S.F.pmin);$('fpmaxv').textContent=S.F.pmax>=4500000?'Sin tope':money(S.F.pmax);$('fdmaxv').textContent=S.F.dmax>=4000?'Sin tope':dTxt(S.F.dmax);$('fsminv').textContent=S.F.smin||'Cualquiera';const n=filtered().length;$('fcount').textContent='Ver '+n+' resultado'+(n===1?'':'s')}
  else if(id==='goff'){S.off=+el.value;$('goffv').textContent=S.off+' m'}
  else if(id==='thr'){me().thr=+el.value;$('thrv').textContent=el.value}});
document.addEventListener('change',ev=>{const el=ev.target,id=el.id;if(!id)return;
  if(el.hasAttribute('data-f')&&el.tagName!=='TEXTAREA'){S.f[id]=el.type==='checkbox'?el.checked:el.value;if(['rm','rs'].includes(id))softRender()}
  if(id==='uni'){me().uni=el.value;S.mapSel=null;save();render()}
  else if(id==='sort'){S.F.sort=el.value;save();render()}
  else if(id==='favail'){S.F.avail=el.value;save();render()}
  else if(id==='fver'){S.F.ver=el.checked;save();render()}
  else if(id==='facc'){S.F.acc=el.checked;save();render()}
  else if(id==='thr'||id==='goff'||id==='fpmin'||id==='fpmax'||id==='fdmax'||id==='fsmin')save()});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='ct'){ev.preventDefault();const t=thById(S.tid),i=ev.target;if(t&&i.value.trim()){say(t,i.value);i.value='';render()}}});
render();setInterval(tick,600);

</script>
